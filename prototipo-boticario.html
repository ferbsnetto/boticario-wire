<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protótipo O Boticário</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: protótipo navegável do wireframe, cinza e branco com acento dourado, desktop primeiro e responsivo */
:root{color-scheme:light;--bg:#FFFFFF;--fg:#1C2B26;--muted:#4F5F58;--line:#8A8A8A;--soft:#F2F0EB;--img:#E3E0D8;--bar:#E6E2D9;--gold:#C9A15A;--ongold:#1C2B26;--primary:#1C2B26;--onprimary:#FFFFFF;--danger:#9B2C1F;--ok:#1F6B45;--dim:#CFCBC2;--font:'DM Sans',system-ui,-apple-system,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121715;--fg:#EDEFEA;--muted:#AEB9B3;--line:#7C8883;--soft:#1B2320;--img:#28312D;--bar:#1F2824;--primary:#EDEFEA;--onprimary:#121715;--danger:#F0897B;--ok:#7FD1A2;--dim:#2A332F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121715;--fg:#EDEFEA;--muted:#AEB9B3;--line:#7C8883;--soft:#1B2320;--img:#28312D;--bar:#1F2824;--primary:#EDEFEA;--onprimary:#121715;--danger:#F0897B;--ok:#7FD1A2;--dim:#2A332F;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
a{color:var(--fg)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.proto{background:var(--primary);color:var(--onprimary);font-size:13px}
.proto .wrap{display:flex;gap:12px;align-items:center;padding-block:8px}
.proto b{white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0}
.chips button{flex:none;border:1px solid currentColor;background:transparent;color:inherit;border-radius:14px;padding:2px 12px;cursor:pointer;font-size:13px}
.chips button[aria-current="page"]{background:var(--gold);color:var(--ongold);border-color:var(--gold);font-weight:700}
.proto .reset{flex:none;background:transparent;border:0;color:inherit;text-decoration:underline;cursor:pointer;font-size:13px}
.util{background:var(--bar);font-size:14px}
.util .wrap{display:flex;justify-content:space-between;gap:12px;align-items:center;padding-block:6px;flex-wrap:wrap}
.util form{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.util input{height:30px;width:130px;padding:0 10px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg)}
.top .wrap{display:flex;align-items:center;gap:20px;padding-block:14px;flex-wrap:wrap}
.logo{width:140px;height:44px;background:var(--dim);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted);border:0;cursor:pointer}
.search{flex:1;min-width:200px;display:flex}
.search input{width:100%;height:48px;padding:0 20px;border:1.5px solid var(--line);border-radius:24px;background:var(--bg)}
.link{background:none;border:0;padding:0;cursor:pointer;font-size:15px;text-decoration:none}
.link:hover{text-decoration:underline}
nav.cats{border-top:1.5px solid var(--line);border-bottom:1.5px solid var(--line);position:relative}
nav.cats .wrap{display:flex;justify-content:center;gap:8px 32px;flex-wrap:wrap}
nav.cats button{background:none;border:0;border-bottom:4px solid transparent;padding:14px 0 10px;font-weight:500;cursor:pointer}
nav.cats button[aria-expanded="true"],nav.cats button.on{border-bottom-color:var(--fg);font-weight:700}
.mega{position:absolute;left:0;right:0;top:100%;z-index:5;background:var(--bg);border-bottom:1.5px solid var(--line);box-shadow:0 12px 24px rgba(0,0,0,.18)}
.mega .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:24px 48px;padding-block:28px 36px}
.mega h3{margin:0 0 6px;font-size:18px}
.mega button{display:block;background:none;border:0;padding:3px 0;cursor:pointer;text-align:left}
.mega button:hover{text-decoration:underline}
main{padding-block:32px 56px;display:flex;flex-direction:column;gap:48px}
h1,h2,h3{line-height:1.15;margin:0}
h1{font-size:clamp(28px,4vw,40px)}
h2{font-size:clamp(22px,2.6vw,28px)}
.btn{height:48px;padding:0 24px;border-radius:6px;border:1.5px solid var(--primary);background:var(--bg);font-weight:700;cursor:pointer}
.btn-p{background:var(--primary);color:var(--onprimary)}
.btn-l{height:56px;font-size:18px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{height:44px;padding:0 16px;font-size:15px}
.hero{position:relative;min-height:380px;background:var(--img);display:flex;flex-direction:column;justify-content:center;gap:16px;padding:48px clamp(20px,6vw,80px) 90px}
.hero p{margin:0;font-size:18px;color:var(--muted);max-width:520px}
.hero h1{max-width:640px}
.hctl{position:absolute;right:20px;bottom:20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hctl button{height:44px;min-width:44px;padding:0 14px;border:1.5px solid var(--fg);border-radius:6px;background:var(--bg);cursor:pointer;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:16px}
.tile{background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;gap:8px;text-align:center}
.ph{background:var(--img);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted);text-align:center}
.tile .ph{height:120px}
.tile span.n{font-weight:700}
.tabs{display:flex;gap:28px;border-bottom:1.5px solid var(--line);flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:4px solid transparent;height:48px;font-size:20px;cursor:pointer}
.tabs button[aria-selected="true"]{border-bottom-color:var(--fg);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:24px}
.card{display:flex;flex-direction:column;gap:8px;padding:16px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);min-width:0}
.card .ph{height:200px;cursor:pointer;border:0}
.card .nm{font-weight:700;background:none;border:0;padding:0;text-align:left;cursor:pointer;font-size:16px}
.muted{color:var(--muted);font-size:14px}
.price{font-size:20px;font-weight:700}
.selo{align-self:flex-start;padding:2px 10px;background:var(--primary);color:var(--onprimary);font-size:13px;font-weight:700}
.selo.o{background:transparent;color:var(--fg);border:1.5px solid var(--fg)}
.offers{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px}
.offer{padding:24px;background:var(--soft);border:1.5px solid var(--line);border-radius:6px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.offer b{font-size:20px}
footer{background:var(--soft);border-top:1.5px solid var(--line);font-size:15px}
footer .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px;padding-block:36px}
footer button{display:block;background:none;border:0;padding:2px 0;cursor:pointer;text-align:left}
.crumb{font-size:14px;color:var(--muted)}
.layout{display:flex;gap:32px;align-items:flex-start}
.side{flex:none;width:280px;padding:24px;border:1.5px solid var(--line);border-radius:6px;display:flex;flex-direction:column;gap:20px}
.side fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.side legend{font-weight:700;padding:0;margin-bottom:6px}
.side label{display:flex;gap:10px;align-items:center;cursor:pointer}
.side input[type=checkbox]{width:20px;height:20px;accent-color:var(--primary)}
.sw{display:flex;gap:8px}
.sw button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);cursor:pointer;padding:0}
.sw button[aria-pressed="true"]{outline:3px solid var(--fg);outline-offset:2px}
.results{flex:1;min-width:0;display:flex;flex-direction:column;gap:20px}
.bar{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}
.chip[aria-pressed="true"]{border-color:var(--fg);border-width:3px;font-weight:700}
.chip{padding:6px 14px;border:1.5px solid var(--line);border-radius:16px;background:var(--bg);cursor:pointer;font-size:15px}
select,.fld{height:48px;padding:0 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);width:100%}
select{width:auto;height:44px}
.fld.bad{border-color:var(--danger);border-width:2px}
.err{color:var(--danger);font-size:14px;margin:0}
label.l{font-weight:700;font-size:15px}
.two{display:grid;grid-template-columns:minmax(0,640px) minmax(0,1fr);gap:56px;align-items:flex-start}
.gal{display:flex;flex-direction:column;gap:12px}
.gal .main{height:min(560px,70vw)}
.thumbs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.thumbs button{height:90px;border:1.5px solid var(--line);background:var(--img);color:var(--muted);cursor:pointer;font-size:13px;padding:2px}
.thumbs button[aria-pressed="true"]{border:3px solid var(--fg)}
.buy{display:flex;flex-direction:column;gap:18px;min-width:0}
.box{padding:20px;background:var(--soft);border:1.5px solid var(--line);border-radius:6px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.info3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}
.info3>div{padding:24px;border:1.5px solid var(--line);border-radius:6px;display:flex;flex-direction:column;gap:8px}
.sp{display:grid;grid-template-columns:1fr 400px;gap:40px;align-items:flex-start}
.line{display:flex;gap:20px;padding:20px;border:1.5px solid var(--line);border-radius:6px;flex-wrap:wrap}
.line .ph{width:120px;height:120px;flex:none}
.line .d{flex:1;min-width:200px;display:flex;flex-direction:column;gap:6px}
.qty{display:inline-flex;border:1.5px solid var(--line);border-radius:6px;align-items:center}
.qty button{width:44px;height:44px;border:0;background:transparent;font-size:20px;cursor:pointer}
.qty span{min-width:36px;text-align:center}
.meter{height:12px;background:var(--dim);border-radius:6px}
.meter div{height:12px;background:var(--primary);border-radius:6px}
.sum{padding:24px;border:1.5px solid var(--line);border-radius:6px;display:flex;flex-direction:column;gap:14px;background:var(--soft)}
.sum .t{display:flex;justify-content:space-between;gap:12px}
.sum .tot{font-size:22px;font-weight:700;border-top:1.5px solid var(--line);padding-top:12px}
.hint{padding:12px 14px;background:var(--bg);border:1.5px dashed var(--line);border-radius:6px;font-size:15px}
.steps{display:flex;gap:10px;flex-wrap:wrap;list-style:none;padding:0;margin:0}
.steps li{padding:8px 18px;border:1.5px solid var(--line);border-radius:20px;font-size:15px}
.steps li.on{background:var(--primary);color:var(--onprimary);border-color:var(--primary);font-weight:700}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px}
.pane{padding:28px;border:1.5px solid var(--line);border-radius:6px;display:flex;flex-direction:column;gap:14px}
.pane.main{border:3px solid var(--primary)}
.f4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.f4>div{display:flex;flex-direction:column;gap:6px;min-width:0}
.s2{grid-column:span 2}
.opt{display:flex;gap:12px;padding:16px;border:1.5px solid var(--line);border-radius:6px;cursor:pointer}
.opt.on{border:3px solid var(--primary);padding:14.5px}
.opt input{width:20px;height:20px;accent-color:var(--primary);flex:none;margin-top:3px}
.tl{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;font-size:15px}
.tl>div{display:flex;flex-direction:column;gap:6px}
.tl i{height:8px;border-radius:4px;background:var(--dim)}
.tl .done i{background:var(--primary)}
.tl .cur i{background:var(--gold)}
.notice{padding:14px 16px;border:1.5px solid var(--danger);border-radius:6px;color:var(--danger);font-weight:500}
.okbox{padding:14px 16px;border:1.5px solid var(--ok);border-radius:6px;color:var(--ok);font-weight:500}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--primary);color:var(--onprimary);padding:12px 20px;border-radius:8px;z-index:20;max-width:92vw;display:flex;gap:14px;align-items:center}
.toast button{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;font-weight:700}
.co-top .wrap{display:flex;justify-content:space-between;align-items:center;padding-block:14px;gap:12px;flex-wrap:wrap}
.co-top{border-bottom:1.5px solid var(--line)}
@media (max-width:900px){.two,.sp{grid-template-columns:1fr}.sp2{grid-template-columns:1fr !important}.layout{flex-direction:column}.side{width:100%}.f4{grid-template-columns:repeat(2,minmax(0,1fr))}.tl{grid-template-columns:1fr}.tl>div{flex-direction:row;align-items:center;gap:10px}.tl i{width:36px;flex:none}}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}
</style>
</head>

];
var M={
'Perfumaria':[['Para quem',['Feminina','Masculina','Unissex','Infantil']],['Tipo',['Desodorante colônia','Body splash','Kits para presente','Miniaturas']],['Por família olfativa',['Amadeirado','Aromático','Cítrico','Floral','Frutal','Oriental']],['Marcas e linhas',['Egeo','Malbec','Floratta','Make B.']]],
'Maquiagem':[['Rosto',['Base','Corretivo','Pó','Blush']],['Olhos',['Máscara de cílios','Sombra','Delineador','Sobrancelha']],['Boca',['Batom','Batom líquido','Gloss','Lápis labial']],['Marcas e linhas',['Make B.','Linha vegana']]],

'Ofertas e benefícios':[['Ofertas',['Combos','Refis econômicos','Últimas unidades']],['Benefícios',['Frete grátis','Cupom de 1ª compra','Fidelidade e cashback']]]
};
var S;
function fresh(){return{route:'home',cart:[],cep:'',ship:'casa',pay:'cartao',email:'',tab:0,menu:false,cat:'Maquiagem',sub:'Boca',paused:false,slide:0,filters:{tipo:[],tom:null,retire:false},sort:'vendidos',prod:1,tone:0,thumb:0,fav:{},lojas:false,cupom:'',cupomOk:false,f:{cep:'',rua:'',num:'',comp:'',bairro:'',cidade:'',uf:'',card:''},err:{},declined:false,order:null,bought:[],help:'',account:false,notify:false,prodCep:'',login:false,delivered:null}}
S=fresh();
var SLIDES=[['Uma mensagem por banner','Texto de apoio do banner de exemplo.'],['Compre sem criar conta','Informe seu CEP e veja prazo e retirada na loja antes de pagar.'],['Ofertas e benefícios reunidos','Frete grátis, cupom e fidelidade em um só lugar.']];
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(v){return 'R$ '+v.toFixed(2).replace('.',',')}
function digits(s){return String(s||'').replace(/\D/g,'')}
function cepOk(c){return digits(c).length===8}
function days(c){return 2+(parseInt(digits(c)[0],10)%4)}
function prod(id){return P.filter(function(p){return p.id===id})[0]}
function sub(){return S.cart.reduce(function(a,l){return a+prod(l.id).price*l.qty},0)}
function disc(){return S.cupomOk?sub()*0.1:0}
function frete(){if(S.ship==='loja')return 0;return sub()-disc()>=199?0:14.9}
function total(){return sub()-disc()+frete()}
function count(){return S.cart.reduce(function(a,l){return a+l.qty},0)}
function variants(p){return p.cat==='Maquiagem'?COLORS:['50 ml','100 ml','200 ml']}
function tiposCat(){var r=[];P.forEach(function(p){if(p.cat===S.cat&&r.indexOf(p.tipo)<0)r.push(p.tipo)});return r}
function detail(p){if(p.cat==='Perfumaria')return '<div><h3>Notas olfativas</h3><span>Topo: [notas]</span><span>Coração: [notas]</span><span>Fundo: [notas]</span></div>';if(p.cat==='Maquiagem')return '<div><h3>Cor e acabamento</h3><span>Tom: '+COLORS[S.tone]+'</span><span>Duração: até 8 horas</span></div>';return '<div><h3>Detalhes</h3><span>Tamanho: '+variants(p)[S.tone]+'</span><span>Indicação: uso diário</span></div>'}
function stockBadge(p){return p.stock==='out'?'<span class="selo o">Sem estoque</span>':p.stock==='low'?'<span class="selo o">Poucas unidades</span>':'<span class="selo">Em estoque</span>'}
function deliveryLine(p){if(p.stock==='out')return '<span class="muted">Indisponível no momento</span>';if(!cepOk(S.cep))return '<span class="muted">Informe o CEP no topo para ver prazo'+(p.pickup?' e retirada':'')+'</span>';return '<span class="muted">Receba em até '+days(S.cep)+' dias úteis'+(p.pickup?' · Retire hoje na loja':'')+'</span>'}
function toast(msg,action,label){var t=document.getElementById('toast');t.innerHTML='<div class="toast"><span>'+msg+'</span>'+(action?'<button data-a="go" data-v="'+action+'">'+label+'</button>':'')+'</div>';clearTimeout(toast.t);toast.t=setTimeout(function(){t.innerHTML=''},3500)}
function img(t,cls){return '<div class="ph '+(cls||'')+'">'+t+'</div>'}

function protoBar(){return '<div class="proto"><div class="wrap"><b>Protótipo navegável</b><div class="chips" role="navigation" aria-label="Telas do protótipo">'+ROUTES.map(function(r){return '<button data-a="go" data-v="'+r+'"'+(S.route===r?' aria-current="page"':'')+'>'+LABEL[r]+'</button>'}).join('')+'</div><button class="reset" data-a="reset">Reiniciar</button></div></div>'}

 var f=S.f,casa=S.ship==='casa';
 function inp(k,l,extra,cls){return '<div class="'+(cls||'')+'"><label class="l" for="a_'+k+'">'+l+'</label><input id="a_'+k+'" class="fld'+(S.err[k]?' bad':'')+'" data-k="'+k+'" value="'+esc(f[k])+'" '+(extra||'')+'>'+fieldErr(k)+'</div>'}
 var payBody=S.pay==='cartao'?'<div class="f4"><div class="s2">'+'<label class="l" for="card">Número do cartão</label><input id="card" class="fld'+(S.err.card?' bad':'')+'" data-k="card" inputmode="numeric" placeholder="0000 0000 0000 0000" value="'+esc(f.card)+'">'+fieldErr('card')+'</div><div class="s2"><label class="l" for="par">Parcelas</label><select id="par" style="width:100%;height:48px"><option>1x de '+money(total())+' sem juros</option><option>3x de '+money(total()/3)+' sem juros</option></select></div></div><div class="hint">Para ver a recusa do pagamento, use um número terminado em 0000.</div>':S.pay==='pix'?'<div class="hint">O código Pix aparece depois de revisar o pedido. Pagamento aprovado na hora (simulado).</div>':'<div class="hint">O boleto vence em 3 dias. O pedido é separado depois da compensação (simulado).</div>';
 return coTop()+'<main class="wrap">'+steps(2)+'<div style="display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:40px;align-items:flex-start" class="sp2"><div style="display:flex;flex-direction:column;gap:24px;min-width:0">'+
 '<section class="pane"><h2 style="font-size:24px">Endereço</h2>'+(casa?'<div class="f4">'+inp('cep','CEP','inputmode="numeric" placeholder="00000-000"')+inp('rua','Rua','','s2')+inp('num','Número')+inp('comp','Complemento')+inp('bairro','Bairro')+inp('cidade','Cidade')+inp('uf','UF')+'</div>':'<p style="margin:0">Você vai retirar na loja. Não precisa informar endereço de entrega.</p>')+'</section>'+
 '<section class="pane"><h2 style="font-size:24px">Como você quer receber</h2><div class="cols2" style="gap:16px"><label class="opt'+(casa?' on':'')+'"><input type="radio" name="ent" data-a="ship" data-v="casa"'+(casa?' checked':'')+'><span><b>Entrega em casa</b><br>'+(cepOk(S.cep)?'Chega em até '+days(S.cep)+' dias úteis · '+(sub()-disc()>=199?'Grátis':money(14.9)):'Informe o CEP')+'</span></label><label class="opt'+(!casa?' on':'')+'"><input type="radio" name="ent" data-a="ship" data-v="loja"'+(!casa?' checked':'')+'><span><b>Retirar na loja</b><br>Grátis · pronto em 2 horas<br><span class="muted">'+S.cart.filter(function(l){return prod(l.id).pickup}).length+' de '+S.cart.length+' itens com estoque na Loja Centro</span></span></label></div>'+(!casa&&S.cart.some(function(l){return !prod(l.id).pickup})?'<div class="notice">Alguns itens não estão disponíveis para retirada. Eles seguem por entrega, ou volte para entrega em casa.</div>':'')+'</section>'+
 '<section class="pane"><h2 style="font-size:24px">Pagamento</h2><div class="row" role="tablist">'+['cartao','pix','boleto'].map(function(k){return '<button class="btn sm'+(S.pay===k?' btn-p':'')+'" role="tab" aria-selected="'+(S.pay===k)+'" data-a="pay" data-v="'+k+'">'+{cartao:'Cartão',pix:'Pix',boleto:'Boleto'}[k]+'</button>'}).join('')+'</div>'+payBody+(S.declined?'<div class="notice" role="alert">Pagamento recusado pelo banco emissor. Tente outro cartão ou escolha Pix. Os dados da compra continuam salvos.</div>':'')+'</section></div>'+
 miniSum('<button class="btn btn-p btn-l" data-a="paynow">Revisar e pagar</button>')+'</div></main>'}

var STEPS_CASA=['Pedido recebido','Pagamento aprovado','Separando itens','Em transporte','Entregue'];
var STEPS_LOJA=['Pedido recebido','Pagamento aprovado','Separando itens','Pronto para retirada','Retirado'];
function ensureOrder(){if(!S.order){S.order={no:'482913',items:[{id:1,qty:1,tone:0}],total:49.9+14.9,mode:'casa',email:'voce@email.com',status:2,pay:'cartao'}}}
function vOrder(){
 ensureOrder();var o=S.order,st=o.mode==='loja'?STEPS_LOJA:STEPS_CASA;
 var tl='<div class="tl">'+st.map(function(t,i){return '<div class="'+(i<o.status?'done':i===o.status?'cur':'')+'"><i></i><b>'+t+'</b><span class="muted">'+(i<=o.status?'concluído em [data]':'previsão [data]')+'</span></div>'}).join('')+'</div>';
 var last=o.status>=4;
 var helpBox=S.help==='falta'?'<div class="okbox">Registramos a falta do item. Você pode esperar, trocar por similar ou cancelar só esse item. (simulado)</div>':S.help==='troca'?'<div class="okbox">Pedido de troca aberto. Enviaremos a etiqueta por e-mail. (simulado)</div>':S.help==='atend'?'<div class="okbox">Atendimento avisado. Respondemos em até 1 dia útil. (simulado)</div>':'';
 return coTop()+'<main class="wrap"><div><h1>Pedido confirmado</h1><span>Pedido <b>#'+o.no+'</b> · enviamos a confirmação para <b>'+esc(o.email)+'</b></span></div><div class="sp"><div style="display:flex;flex-direction:column;gap:24px;min-width:0"><section class="pane"><h2 style="font-size:24px">Acompanhar pedido</h2>'+tl+'<div class="row"><span>Código de rastreio: <b>BR'+o.no+'XX</b></span><button class="link" style="font-weight:700" data-a="note">Abrir rastreio da transportadora</button></div><div><button class="btn sm" data-a="advance"'+(last?' disabled':'')+'>Simular próxima etapa</button> <span class="muted">controle só do protótipo</span></div></section>'+
 (o.mode==='loja'&&o.status>=3?'<section class="box"><b style="font-size:20px">Pronto para retirada na Loja Centro</b><span>Retire até [data] com documento e o código <b>'+o.no+'</b>.</span></section>':o.mode==='loja'?'<section class="box"><b>Retirada na Loja Centro</b><span>Avisamos aqui e por e-mail quando estiver pronto. Se faltar algum item, você escolhe esperar, trocar ou cancelar só esse item.</span></section>':'')+
 (last?'<section class="pane"><h2 style="font-size:24px">Recebeu tudo certo?</h2><div class="row"><button class="btn btn-p sm" data-a="rateok">Sim, recebi tudo</button><button class="btn sm" data-a="help" data-v="troca">Não, quero resolver</button></div>'+(S.help==='ok'?'<div class="okbox">Que bom! Avalie seus produtos ou compre de novo na Home, aba “Comprar de novo”.</div>':'')+'</section>':'')+
 '<section class="pane"><h2 style="font-size:24px">Algo não saiu certo?</h2><div class="row"><button class="btn sm" data-a="help" data-v="falta">Item faltando ou errado</button><button class="btn sm" data-a="help" data-v="troca">Pedir troca ou devolução</button><button class="btn sm" data-a="help" data-v="atend">Falar com atendimento</button></div>'+helpBox+'</section></div>'+
 '<div style="display:flex;flex-direction:column;gap:20px"><aside class="sum"><b style="font-size:20px">Resumo</b>'+o.items.map(function(l){var p=prod(l.id);return '<div class="row" style="flex-wrap:nowrap"><div class="ph" style="width:64px;height:64px;flex:none;font-size:12px">imagem</div><span>'+p.name+' · '+l.qty+' un.<br>'+money(p.price*l.qty)+'</span></div>'}).join('')+'<div class="t tot"><span>Total pago</span><span>'+money(o.total)+'</span></div><span class="muted">'+(o.mode==='loja'?'Retirada: Loja Centro':'Entrega: [endereço informado]')+'</span></aside>'+
 (S.account?'<div class="okbox">Conta criada com os dados do pedido. Seus pedidos ficam em Minha conta.</div>':'<form class="pane main" data-form="account" novalidate><b style="font-size:20px">Guardar seus dados?</b><span style="color:var(--muted)">Crie uma conta com os dados deste pedido. Só falta uma senha.</span><label class="l" for="pw" style="position:absolute;left:-9999px">Senha</label><input id="pw" class="fld'+(S.err.pw?' bad':'')+'" type="password" data-k="pw" placeholder="Crie uma senha (mínimo 6)">'+fieldErr('pw')+'<button class="btn btn-p">Criar conta</button><button class="link" type="button" style="font-weight:700;text-align:left" data-a="go" data-v="home">Agora não</button></form>')+'</div></div></main>'+footer()}

function view(){
 var r=S.route,body;
 if(r==='home')body=vHome();else if(r==='listagem')body=vList();else if(r==='produto')body=vProd();else if(r==='sacola')body=vBag();else if(r==='identificacao')body=vId();else if(r==='pagamento')body=vPay();else body=vOrder();
 var co=(r==='identificacao'||r==='pagamento'||r==='pedido');
 return protoBar()+(co?'':header())+body}
function render(keep){var y=window.scrollY;document.getElementById('app').innerHTML=view();if(keep)window.scrollTo(0,y)}

function go(r){if(ROUTES.indexOf(r)<0)r='home';S.menu=false;if(location.hash==='#'+r){S.route=r;render();window.scrollTo(0,0)}else location.hash=r}
function onHash(){var r=(location.hash||'#home').slice(1);if(ROUTES.indexOf(r)<0)r='home';if((r==='pagamento'||r==='identificacao')&&!S.cart.length){S.route='sacola';location.replace('#sacola');render();window.scrollTo(0,0);toast('Sua sacola está vazia. Adicione um produto para continuar.');return}S.route=r;S.menu=false;render();window.scrollTo(0,0)}
function addToCart(id,tone){var l=S.cart.filter(function(x){return x.id===id&&x.tone===tone})[0];if(l)l.qty++;else S.cart.push({id:id,qty:1,tone:tone})}
function setCep(v){if(cepOk(v)){var d=digits(v);S.cep=d.slice(0,5)+'-'+d.slice(5);S.f.cep=S.cep;S.prodCep=S.cep;return true}return false}
function placeOrder(){var no=String(480000+Math.floor(Math.random()*9999));S.order={no:no,items:S.cart.map(function(l){return{id:l.id,qty:l.qty,tone:l.tone}}),total:total(),mode:S.ship,email:S.email||'voce@email.com',status:1,pay:S.pay};S.bought=S.cart.map(function(l){return l.id}).filter(function(v,i,a){return a.indexOf(v)===i});S.cart=[];S.cupom='';S.cupomOk=false;S.help='';S.account=false;S.err={};location.hash='pedido'}

var A={
go:function(t){go(t.dataset.v)},
reset:function(){var keepHash=true;S=fresh();document.getElementById('toast').innerHTML='';if(location.hash==='#home'||!location.hash){render();window.scrollTo(0,0)}else location.hash='home'},
menu:function(t){S.menu=S.menu===t.dataset.v?false:t.dataset.v;render(true)},
cat:function(t){S.cat=t.dataset.v;S.sub=t.dataset.s||'';S.filters={tipo:[],tom:null,retire:false};S.menu=false;go('listagem')},
pause:function(){S.paused=!S.paused;render(true)},
slide:function(t){S.slide=(S.slide+parseInt(t.dataset.v,10)+SLIDES.length)%SLIDES.length;render(true)},
tab:function(t){S.tab=parseInt(t.dataset.v,10);render(true)},
tipo:function(t){var v=t.dataset.v,i=S.filters.tipo.indexOf(v);if(i<0)S.filters.tipo.push(v);else S.filters.tipo.splice(i,1);render(true)},
tom:function(t){var v=parseInt(t.dataset.v,10);S.filters.tom=S.filters.tom===v?null:v;render(true)},
retire:function(){S.filters.retire=!S.filters.retire;render(true)},
clear:function(){S.filters={tipo:[],tom:null,retire:false};render(true)},
open:function(t){S.prod=parseInt(t.dataset.v,10);S.tone=0;S.thumb=0;S.lojas=false;S.notify=false;go('produto')},
quick:function(t){var id=parseInt(t.dataset.v,10);addToCart(id,0);render(true);toast('Adicionado à sacola.','sacola','Ver sacola')},
buy:function(){addToCart(S.prod,S.tone);go('sacola')},
thumb:function(t){S.thumb=S.thumb===parseInt(t.dataset.v,10)+1?0:parseInt(t.dataset.v,10)+1;render(true)},
tone:function(t){S.tone=parseInt(t.dataset.v,10);render(true)},
lojas:function(){S.lojas=!S.lojas;render(true)},
favp:function(){S.fav[S.prod]=!S.fav[S.prod];render(true)},
fav:function(){toast('Favoritos: use “Favoritar” na página do produto.')},
notify:function(){S.notify=!S.notify;render(true);toast(S.notify?'Avisaremos você quando o produto chegar.':'Aviso desativado.')},
qty:function(t){var a=t.dataset.v.split(':'),l=S.cart[parseInt(a[0],10)];l.qty=Math.max(1,l.qty+parseInt(a[1],10));render(true)},
rm:function(t){S.cart.splice(parseInt(t.dataset.v,10),1);render(true)},
checkout:function(){go('identificacao')},
login:function(){S.login=!S.login;render(true);toast(S.login?'Você entrou (simulado).':'Você saiu.')},
google:function(){S.login=true;S.email=S.email||'voce@email.com';S.err={};go('pagamento')},
ship:function(t){S.ship=t.dataset.v;render(true)},
pay:function(t){S.pay=t.dataset.v;S.declined=false;render(true)},
paynow:function(){var f=S.f,e={};if(S.ship==='casa'){if(!cepOk(f.cep))e.cep='Informe um CEP com 8 números.';if(!f.rua)e.rua='Informe a rua.';if(!f.num)e.num='Informe o número.'}
 if(S.pay==='cartao'&&digits(f.card).length<13)e.card='Número do cartão incompleto. Confira os dígitos.';
 S.err=e;S.declined=false;if(Object.keys(e).length){render(true);return}
 if(S.pay==='cartao'&&digits(f.card).slice(-4)==='0000'){S.declined=true;render(true);return}
 placeOrder()},
advance:function(){if(S.order.status<4){S.order.status++;render(true)}},
rateok:function(){S.help='ok';render(true)},
help:function(t){S.help=t.dataset.v;render(true)},
help2:function(){toast('Atendimento: ajuda sempre visível no topo do checkout (exemplo).')},
note:function(){toast('Página fora do escopo deste protótipo.')},
cupomhint:function(){try{navigator.clipboard.writeText('BEMVINDO').then(function(){toast('Cupom BEMVINDO copiado.')},function(){toast('Cupom: BEMVINDO')})}catch(e){toast('Cupom: BEMVINDO')}}
};
document.addEventListener('click',function(e){var t=e.target.closest('[data-a]');if(!t||t.tagName==='SELECT')return;var a=t.dataset.a;if(t.type==='radio'&&e.target!==t)return;if(A[a])A[a](t);
 if(S.menu&&!e.target.closest('nav.cats')){S.menu=false;render(true)}});
document.addEventListener('click',function(e){if(S.menu&&!e.target.closest('[data-a]')&&!e.target.closest('.mega')){S.menu=false;render(true)}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.menu){S.menu=false;render(true)}});
document.addEventListener('change',function(e){var t=e.target;if(t.dataset.a==='sort'){S.sort=t.value;render(true)}
 if(t.dataset.k==='cep'&&cepOk(t.value)){var d=digits(t.value);S.f.cep=d.slice(0,5)+'-'+d.slice(5);if(!S.f.rua){S.f.rua='Rua Exemplo';S.f.bairro='Centro';S.f.cidade='Curitiba';S.f.uf='PR'}if(!S.cep)S.cep=S.f.cep;render(true)}});
document.addEventListener('input',function(e){var k=e.target.dataset.k;if(!k)return;if(k==='hcep'||k==='bcep'||k==='pcep')return;if(k in S.f)S.f[k]=e.target.value;else if(k==='email')S.email=e.target.value;else if(k==='cupom')S.cupom=e.target.value});
document.addEventListener('submit',function(e){var f=e.target.dataset.form;if(!f)return;e.preventDefault();var form=e.target;
 if(f==='cep'){var v=form.querySelector('[data-k="hcep"]').value;if(setCep(v)){render(true);toast('Prazos atualizados para '+S.cep+'.')}else toast('Digite um CEP com 8 números.')}
 else if(f==='cep2'){var v2=form.querySelector('[data-k="bcep"]').value;if(setCep(v2)){render(true)}else toast('Digite um CEP com 8 números.')}
 else if(f==='pcep'){var v3=form.querySelector('[data-k="pcep"]').value;if(cepOk(v3)){var d=digits(v3);S.prodCep=d.slice(0,5)+'-'+d.slice(5);if(!S.cep){S.cep=S.prodCep;S.f.cep=S.cep}render(true)}else toast('Digite um CEP com 8 números.')}
 else if(f==='search'){go('listagem')}
 else if(f==='cupom'){if(S.cupom.trim().toUpperCase()==='BEMVINDO'){S.cupomOk=true;S.err={}}else{S.cupomOk=false;S.err={cupom:'Cupom não encontrado. Confira o código e tente de novo.'}}render(true)}
 else if(f==='guest'){var em=(S.email||'').trim();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){S.err={email:'Digite um e-mail completo, como voce@email.com.'};render(true);var el=document.getElementById('email');if(el)el.focus();return}S.email=em;S.err={};go('pagamento')}
 else if(f==='login'){S.login=true;S.email=S.email||'voce@email.com';S.err={};go('pagamento')}
 else if(f==='account'){var pw=document.getElementById('pw').value;if(pw.length<6){S.err={pw:'A senha precisa ter pelo menos 6 caracteres.'};render(true);return}S.err={};S.account=true;S.login=true;render(true)}});
window.addEventListener('hashchange',onHash);
setInterval(function(){if(S.route!=='home'||S.paused||document.hidden||matchMedia('(prefers-reduced-motion: reduce)').matches)return;var h=document.getElementById('hh');if(!h)return;S.slide=(S.slide+1)%SLIDES.length;h.textContent=SLIDES[S.slide][0];document.getElementById('hp').textContent=SLIDES[S.slide][1];document.getElementById('hn').textContent=(S.slide+1)+' / '+SLIDES.length},6000);
onHash();
})();
</script>
